# coturn. Secret, realm and external IP are injected via compose command-line flags (see docker-compose.yml).
listening-port=3478
min-port=49160
max-port=49200
fingerprint

# Time-limited credentials minted by the signaling server (TURN REST API).
use-auth-secret

# Do not become an open proxy into the host's networks.
no-cli
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255

# Abuse limits.
user-quota=12
total-quota=1200
stale-nonce=600

# Privacy: no per-session logging of peers.
no-software-attribute
simple-log

# TLS (turns:) is optional; mount certs and uncomment to enable.
#tls-listening-port=5349
#cert=/etc/coturn/certs/fullchain.pem
#pkey=/etc/coturn/certs/privkey.pem
